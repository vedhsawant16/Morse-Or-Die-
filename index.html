<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width,
                 initial-scale=1.0,
                 maximum-scale=1.0,
                 user-scalable=no,
                 viewport-fit=cover"
    >

    <title>SECRET FACILITY 404: MORSE OR DIE</title>

    <!-- Phaser 3 CDN -->
    <script src="https://cdn.jsdelivr.net/npm/phaser@3.80.0/dist/phaser.min.js"></script>

    <!-- Game Scripts -->
    <script src="js/audioSynth.js"></script>
    <script src="js/morseData.js"></script>
    <script src="js/BootScene.js"></script>
    <script src="js/MenuScene.js"></script>
    <script src="js/GameScene.js"></script>
    <script src="js/GameOverScene.js"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            background-color: #030805;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;

            display: flex;
            align-items: center;
            justify-content: center;

            /* Prevent mobile browser scrolling */
            touch-action: none;

            /* Support phone safe areas */
            padding:
                env(safe-area-inset-top)
                env(safe-area-inset-right)
                env(safe-area-inset-bottom)
                env(safe-area-inset-left);
        }

        /*
         * Game wrapper
         *
         * The wrapper is now responsive instead of being
         * locked to 1280x720.
         */
        #game-wrapper {
            position: relative;

            width: 100vw;
            height: 100vh;

            max-width: 1280px;
            max-height: 720px;

            background: #000;

            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow: 0 0 50px rgba(0, 255, 102, 0.25);

            border: 4px solid #004411;
            border-radius: 12px;
        }

        /*
         * Phaser will resize the canvas to fit this container.
         */
        #game-container {
            width: 100%;
            height: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;
        }

        #game-container canvas {
            display: block;

            /*
             * Never allow the canvas to become larger
             * than the available screen.
             */
            max-width: 100%;
            max-height: 100%;
        }

        /*
         * Desktop instructions
         */
        .instructions-footer {
            position: fixed;

            left: 50%;
            bottom: 8px;

            transform: translateX(-50%);

            width: 95%;

            font-size: 13px;
            color: #66aa77;

            text-align: center;

            pointer-events: none;
        }

        .instructions-footer span {
            color: #ffff00;
        }

        /*
         * MOBILE
         */
        @media (max-width: 700px) {

            body {
                width: 100vw;
                height: 100dvh;
            }

            #game-wrapper {
                width: 100vw;
                height: 100dvh;

                max-width: none;
                max-height: none;

                border: none;
                border-radius: 0;

                box-shadow: none;
            }

            #game-container {
                width: 100vw;
                height: 100dvh;
            }

            #game-container canvas {
                width: 100% !important;
                height: 100% !important;
            }

            /*
             * Hide the desktop instructions on mobile.
             * They reduce the usable game area.
             */
            .instructions-footer {
                display: none;
            }
        }

        /*
         * LANDSCAPE PHONES
         */
        @media (max-width: 900px) and (orientation: landscape) {

            #game-wrapper {
                width: 100vw;
                height: 100dvh;
            }

            #game-container {
                width: 100vw;
                height: 100dvh;
            }
        }

        /*
         * PORTRAIT PHONES
         *
         * Since your game is 16:9, tell the player
         * to rotate their phone instead of squeezing
         * the game into portrait mode.
         */
        @media (max-width: 700px) and (orientation: portrait) {

            #game-wrapper {
                width: 100vw;
                height: 100dvh;
            }

            #game-container {
                width: 100vw;
                height: 100dvh;
            }
        }
    </style>
</head>

<body>

    <div id="game-wrapper">
        <div id="game-container"></div>
    </div>

    <div class="instructions-footer">
        CLASSIFIED FACILITY NOTICE:
        Listen carefully to Morse audio
        <span>[.] Dit</span> &
        <span>[-] Dah</span>.
        Type code on keyboard &
        press <span>ENTER</span>.
        Spacebar to <span>REPEAT SIGNAL</span>.
    </div>

    <script>

        // =====================================================
        // PHASER CONFIGURATION
        // =====================================================

        const config = {

            type: Phaser.AUTO,

            parent: 'game-container',

            /*
             * Keep the INTERNAL game resolution at 1280x720.
             *
             * Phaser will scale this resolution to the
             * available screen.
             */
            width: 1280,
            height: 720,

            backgroundColor: '#020f08',

            scale: {

                /*
                 * FIT maintains the 16:9 aspect ratio.
                 */
                mode: Phaser.Scale.FIT,

                /*
                 * Center the game horizontally and vertically.
                 */
                autoCenter: Phaser.Scale.CENTER_BOTH,

                /*
                 * Phaser automatically reacts to
                 * browser/container resizing.
                 */
                width: 1280,
                height: 720,

                expandParent: true,

                autoRound: true
            },

            scene: [
                BootScene,
                MenuScene,
                GameScene,
                GameOverScene
            ]
        };


        // =====================================================
        // CREATE GAME
        // =====================================================

        const game = new Phaser.Game(config);


        // =====================================================
        // HANDLE MOBILE RESIZE / ROTATION
        // =====================================================

        function resizeGame() {

            const container =
                document.getElementById('game-container');

            if (!container || !game) {
                return;
            }

            /*
             * Tell Phaser that the available area changed.
             */
            game.scale.resize(
                container.clientWidth,
                container.clientHeight
            );
        }


        window.addEventListener('resize', resizeGame);

        window.addEventListener('orientationchange', () => {

            setTimeout(() => {
                resizeGame();
            }, 200);

        });


        /*
         * Run once after the page loads.
         */
        window.addEventListener('load', () => {

            setTimeout(() => {
                resizeGame();
            }, 100);

        });

    </script>

</body>
</html>
